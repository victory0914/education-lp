  </head>
  <body class="inquiry-page">
    <main class="page-shell">
      <section class="first-view inquiry-first-view" aria-label="お問い合わせ">
        <aside class="side-nav" aria-label="サイトナビゲーション">
          <a class="logo" href="index.html#top" aria-label="美樹和ポータルトップへ戻る">
            <img src="image/logo.png" alt="" width="44" height="44">
            <span>美樹和</span>
          </a>

          <nav class="nav-menu">
            <a class="nav-link" href="index.html#top">
              <img src="image/icon-pc.png" alt="" width="48" height="48">
              <span>TOP</span>
            </a>
            <a class="nav-link" href="index.html#activity">
              <img src="image/icon-earth.png" alt="" width="48" height="48">
              <span>活動する</span>
            </a>
            <a class="nav-link" href="index.html#field">
              <img src="image/icon-search.png" alt="" width="48" height="48">
              <span>現場を知る</span>
            </a>
            <a class="nav-link" href="index.html#movie">
              <img src="image/icon-table.png" alt="" width="48" height="48">
              <span>動画で学ぶ</span>
            </a>
            <a class="nav-link" href="category.html">
              <img src="image/icon-folder.png" alt="" width="48" height="48">
              <span>カテゴリー検索</span>
            </a>
            <a class="nav-link" href="https://www.migiwahoikuen.com/top/top.php" target="_blank" rel="noopener noreferrer">
              <img src="image/icon-file.png" alt="" width="48" height="48">
              <span>運営情報</span>
            </a>
          </nav>

          <a class="contact-button" href="inquiry.html" aria-current="page">
            <span aria-hidden="true">□</span>
            お問い合わせ
          </a>
        </aside>

        <div class="inquiry-page-main">
          <div class="inquiry-hero" role="img" aria-label="美樹和ポータルのファーストビュー画像">
            <div class="inquiry-hero-copy">
              <p>CONTACT</p>
              <h1>お問い合わせ</h1>
            </div>
          </div>

          <section class="contact-section inquiry-contact-section" aria-labelledby="contact-title">
            <div class="contact-inner">
              <header class="contact-heading">
                <h2 id="contact-title">お問い合わせ</h2>
                <p>ご相談・お申し込み内容を確認のうえ、5日以内に事務局よりご連絡いたします。</p>
              </header>

              <form class="contact-form" action="https://formsubmit.co/tomohhu0@gmail.com" method="POST">
                <input type="hidden" name="_cc" value="migiwa-portal@gmail.com">
                <input type="hidden" name="_subject" value="美樹和ポータルへのお問い合わせ">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_autoresponse" value="このたびは美樹和ポータルへお問い合わせいただき、誠にありがとうございます。申込完了の自動返信メールとして、本メールをお送りしております。内容を確認のうえ、5日以内に何らかのご連絡を差し上げます。これらのメールの確認ができない場合は、お手数ですが事務局までメールにてご連絡ください。">
                <input type="text" name="_honey" class="form-honey" tabindex="-1" autocomplete="off">

                <div class="form-grid">
                  <label>
                    <span>お名前＊</span>
                    <input type="text" name="お名前" autocomplete="name" required>
                  </label>

                  <label>
                    <span>ふりがな＊</span>
                    <input type="text" name="ふりがな" required>
                  </label>

                  <label>
                    <span>法人名・団体名</span>
                    <input type="text" name="法人名・団体名" autocomplete="organization">
                  </label>

                  <label>
                    <span>メールアドレス＊</span>
                    <input type="email" name="email" autocomplete="email" required>
                  </label>

                  <label>
                    <span>TEL</span>
                    <input type="tel" name="TEL" autocomplete="tel">
                  </label>
                </div>

                <label class="form-message">
                  <span>問合せ内容＊</span>
                  <textarea name="問合せ内容" rows="7" required></textarea>
                </label>

                <p class="form-note">
                  申込完了後、自動返信メールをお送りします。確認できない場合は、お手数ですが事務局までメールにてご連絡ください。
                </p>

                <button class="form-submit" type="submit">送信する</button>
              </form>
            </div>
          </section>
        </div>
      </section>
    </main>

        </nav>

        <a class="footer-logo" href="index.html#top" aria-label="美樹和ポータルトップへ戻る">
          <img src="image/logo.png" alt="" width="40" height="40">
          <span>美樹和</span>
        </a>
      </div>
    </footer>

    <script src="js/index.js" defer></script>
  </body>
